# /etc/ssh/sshd_config.d/00-hardening.conf
#
# Nama diawali "00-" dengan sengaja: sshd memakai nilai PERTAMA yang ditemui
# untuk tiap opsi, dan Include sshd_config.d/*.conf dibaca berurutan nama.
# File ini harus dibaca sebelum 50-cloud-init.conf, yang di sebagian
# provider berisi "PasswordAuthentication yes".
#
# Ubuntu 24.04 memakai socket activation: setelah mengganti Port, wajib
#   systemctl daemon-reload && systemctl restart ssh.socket
# (setup.sh menangani ini otomatis). Restart ssh.service saja TIDAK memindah port.

Port 2222
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# Putus sesi "hantu" (koneksi mati karena VPN ganti, PC sleep) dalam ~3 menit:
# sapa klien tiap 60 detik lewat kanal terenkripsi, putus setelah 3x tak dijawab.
# Default (0) mengandalkan TCP keepalive kernel: baru bersih ~2 jam kemudian.
ClientAliveInterval 60
ClientAliveCountMax 3
